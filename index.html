<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四字熟語 学習 | 漢検準一級</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f3;
      --text: #1a1a18;
      --text-secondary: #6b6b68;
      --text-tertiary: #9b9b97;
      --border: rgba(0,0,0,0.12);
      --border-hover: rgba(0,0,0,0.25);
      --accent: #2C2C2A;
      --accent-text: #F1EFE8;
      --danger: #D85A30;
      --danger-bg: #FAECE7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18;
        --bg-secondary: #242422;
        --text: #F1EFE8;
        --text-secondary: #9b9b97;
        --text-tertiary: #6b6b68;
        --border: rgba(255,255,255,0.12);
        --border-hover: rgba(255,255,255,0.25);
        --accent: #F1EFE8;
        --accent-text: #2C2C2A;
        --danger: #E87050;
        --danger-bg: #3a1f14;
      }
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg-secondary);
      color: var(--text);
      min-height: 100vh;
    }

    #app {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .page-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 8px;
      border: 0.5px solid var(--border-hover);
      background: var(--bg);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--bg-secondary); color: var(--text); }
    .btn-danger { border-color: var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger-bg); }

    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 1.25rem;
      font-size: 12px;
      color: var(--text-secondary);
      align-items: center;
      flex-wrap: wrap;
    }
    .stat-num { font-weight: 500; color: var(--text); }
    .stat-err { color: var(--danger); }

    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 1.25rem;
      border-bottom: 0.5px solid var(--border);
      padding-bottom: 10px;
      flex-wrap: wrap;
    }

    .tab {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px;
      padding: 4px 14px;
      border-radius: 20px;
      border: 0.5px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab:hover { border-color: var(--border-hover); color: var(--text); }
    .tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

    .hint {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 1rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: var(--border-hover); }
    .card.marked { border-left: 2.5px solid var(--danger); }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .card-reading {
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .card-kanji {
      font-family: 'Noto Serif JP', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.12em;
      cursor: pointer;
      display: inline-block;
      position: relative;
      user-select: none;
      color: var(--text);
      line-height: 1.3;
      border-radius: 3px;
      transition: color 0.15s, background 0.15s;
    }

    .card-kanji.hidden {
      color: transparent;
      background: var(--text);
    }
    .card-kanji.hidden::after {
      content: 'タップで表示';
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 9px;
      font-weight: 400;
      color: var(--bg);
      white-space: nowrap;
      letter-spacing: 0;
    }

    .card-kanji.revealed::after {
      content: 'タップで隠す';
      position: absolute;
      left: 50%; top: calc(100% + 4px);
      transform: translateX(-50%);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 9px;
      color: var(--text-tertiary);
      white-space: nowrap;
      letter-spacing: 0;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }
    .card-kanji.revealed:hover::after { opacity: 1; }

    .card-kanji.pop { animation: pop 0.2s ease-out; }
    @keyframes pop {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }

    .card-meaning {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.7;
      border-top: 0.5px solid var(--border);
      padding-top: 8px;
      margin-top: 8px;
    }

    .check-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      margin-top: 2px;
      cursor: pointer;
    }
    .check-label {
      font-size: 11px;
      color: var(--text-tertiary);
      user-select: none;
    }
    input[type="checkbox"].err-check {
      width: 16px; height: 16px;
      cursor: pointer;
      accent-color: var(--danger);
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .cards-grid { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="page-header">
    <div>
      <div class="page-title">四字熟語 学習</div>
      <div class="page-subtitle">漢検準一級レベル</div>
    </div>
    <div class="controls">
      <button class="btn" id="btn-reveal-all">すべて表示</button>
      <button class="btn" id="btn-hide-all">すべて隠す</button>
      <button class="btn btn-danger" id="btn-clear-marks">チェックをリセット</button>
    </div>
  </div>

  <div class="stats-bar">
    <div>全 <span class="stat-num" id="total-count">—</span> 語</div>
    <div>表示中 <span class="stat-num" id="visible-count">—</span> 語</div>
    <div class="stat-err">✕ <span id="err-count">0</span> 要復習</div>
  </div>

  <div class="filter-tabs">
    <button class="tab active" data-filter="all">すべて</button>
    <button class="tab" data-filter="marked">要復習のみ</button>
    <button class="tab" data-filter="unmarked">未チェックのみ</button>
  </div>

  <p class="hint">黒塗り部分をクリック・タップすると漢字が表示されます（再度クリックで隠せます）</p>

  <div id="cards-container">
    <div class="cards-grid" id="cards-grid"></div>
  </div>
</div>

{k:"感奮興起",r:"かんぷんこうき",m:"心から深く感動し、やる気を奮い起こして立ち上がること。"},
{k:"頑迷固陋",r:"がんめいころう",m:"考え方が古いままで凝り固まり、新しい意見を受け入れないこと。"},
{k:"含哺鼓腹",r:"がんぽこふく",m:"人々が豊かに暮らし、何の不満もなく平和を謳歌している様子。"}
];

let markedSet = new Set();
let revealedSet = new Set();
let currentFilter = 'all';

try { const s = localStorage.getItem('yoji_marked'); if (s) markedSet = new Set(JSON.parse(s)); } catch(e) {}

function saveMarks() { try { localStorage.setItem('yoji_marked', JSON.stringify([...markedSet])); } catch(e) {} }

function getFiltered() {
  if (currentFilter === 'marked') return YOJI_DATA.filter(d => markedSet.has(d.k));
  if (currentFilter === 'unmarked') return YOJI_DATA.filter(d => !markedSet.has(d.k));
  return YOJI_DATA;
}

function updateStats() {
  const filtered = getFiltered();
  document.getElementById('total-count').textContent = YOJI_DATA.length;
  document.getElementById('visible-count').textContent = filtered.length;
  document.getElementById('err-count').textContent = markedSet.size;
}

function renderCards() {
  const container = document.getElementById('cards-container');
  const filtered = getFiltered();
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state">該当する四字熟語がありません</div>';
    updateStats(); return;
  }
  container.innerHTML = '<div class="cards-grid" id="cards-grid"></div>';
  const grid = document.getElementById('cards-grid');

  filtered.forEach(d => {
    const isMarked = markedSet.has(d.k);
    const isRevealed = revealedSet.has(d.k);
    const card = document.createElement('div');
    card.className = 'card' + (isMarked ? ' marked' : '');
    card.dataset.key = d.k;
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-reading">${d.r}</div>
          <div class="card-kanji ${isRevealed ? 'revealed' : 'hidden'}" data-key="${d.k}">${d.k}</div>
        </div>
        <label class="check-wrap">
          <input type="checkbox" class="err-check" data-key="${d.k}"${isMarked ? ' checked' : ''}>
          <span class="check-label">要復習</span>
        </label>
      </div>
      <div class="card-meaning">${d.m}</div>
    `;
    grid.appendChild(card);
  });

  grid.addEventListener('click', e => {
    const kanji = e.target.closest('.card-kanji');
    if (kanji) {
      const key = kanji.dataset.key;
      if (kanji.classList.contains('hidden')) {
        revealedSet.add(key);
        kanji.classList.remove('hidden');
        kanji.classList.add('revealed', 'pop');
        setTimeout(() => kanji.classList.remove('pop'), 200);
      } else {
        revealedSet.delete(key);
        kanji.classList.remove('revealed');
        kanji.classList.add('hidden');
      }
      return;
    }
    const cb = e.target.closest('.err-check');
    if (cb) {
      const key = cb.dataset.key;
      const card = cb.closest('.card');
      if (cb.checked) { markedSet.add(key); card.classList.add('marked'); }
      else { markedSet.delete(key); card.classList.remove('marked'); }
      saveMarks(); updateStats();
      if (currentFilter !== 'all') setTimeout(renderCards, 150);
    }
  });

  updateStats();
}

document.getElementById('btn-reveal-all').addEventListener('click', () => {
  getFiltered().forEach(d => revealedSet.add(d.k)); renderCards();
});
document.getElementById('btn-hide-all').addEventListener('click', () => {
  getFiltered().forEach(d => revealedSet.delete(d.k)); renderCards();
});
document.getElementById('btn-clear-marks').addEventListener('click', () => {
  if (!confirm('チェックをすべてリセットしますか？')) return;
  markedSet.clear(); saveMarks(); renderCards();
});
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    renderCards();
  });
});

renderCards();
</script>
</body>
</html>
